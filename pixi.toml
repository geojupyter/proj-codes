[workspace]
authors = ["Benjamin Szeghy <benjamin.szeghy@berkeley.edu>"]
channels = ["conda-forge"]
name = "proj-codes"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
build = "pnpm run build"
test = "pnpm run test"

[dependencies]
python = ">=3.14.6,<3.15"
pnpm = ">=11.20.0,<12"
nodejs = "~=24.19.0"

[pypi-dependencies]
pyproj = ">=3.7.2, <4"
